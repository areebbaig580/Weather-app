<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather-app</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
   <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
        <i class="fa-solid fa-bars"></i>
    </button>
    
    <i class="fa-solid fa-x sidebar-overlay" id="sidebarOverlay"></i>
    <div class="section-1" id="sidebar">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass icon"></i>
            <input type="text" placeholder="Search for places.." class="city-name">
        </div>
        <div class="weather-svg">
            <div class="sun"></div>
            <div class="cloud" style="left:55px; top:30px;">
                <div class="cloud-puff"></div>
                <div class="cloud-body"></div>
            </div>
            <div class="rain-drops" style="position:absolute; bottom:5px; left:55%;">
                <div class="rain-drop"></div>
                <div class="rain-drop"></div>
                <div class="rain-drop"></div>
                <div class="rain-drop"></div>
            </div>
        </div>
        <div class="details">
            <div class="temperature">
                <div class="temp"></div>
                <div class="last-char">°C</div>
            </div>
            <div class="date-time"></div>
        </div>
        <div class="weather-det">
            <i class="fa-solid fa-cloud cloud-icon"></i>
            <div class="weather-det1" id="cloud-det">Cloudy</div>
        </div>
        <div class="weather-det">
            <i class="fa-solid fa-temperature-empty cloud-icon"></i>
            <div class="weather-det1" id="feels-like"></div>
        </div>
        <div class="city"></div>
    </div>
    <div class="section-2">
        <div class="header-nav">
            <div class="toggle">
                <div class="toggle-el">Today</div>
                <div class="toggle-el active-day">Week</div>
            </div>
            <div class="toggle">
                <div class="toggle-temp active">
                    <div class="togle-temp-el1 active-el">o</div>
                    <div class="togle-temp-el2 active-el tab">C</div>

                </div>
                <div class="toggle-temp">
                    <div class="togle-temp-el1">o</div>
                    <div class="togle-temp-el2 tab">F</div>
                </div>
            </div>
        </div>
        <div class="days-container">

        </div>
        <div class="heading-container">
            <div class="heading">Today's Highlights</div>
        </div>
        <div class="weather-det-container">


            <div class="weather-det-box">
                <div class="det-box-head">UV Index</div>
                <div class="det-box-main">
                    <div class="det1 uv"></div>
                </div>
                <div class="det-box-btm">
                    <div class="btm-icn">
                        <i class="fa-solid fa-sun uv-sun"></i>
                    </div>
                    <div class="btm-det uv-status"></div>
                </div>
            </div>
            <div class="weather-det-box">
                <div class="det-box-head">Wind status</div>
                <div class="det-box-main">
                    <div class="det1 wind-speed"></div>
                    <div class="det2">km/h</div>
                </div>
                <div class="det-box-btm">
                    <div class="btm-icn">
                        <i class="fa-solid fa-wind wind"></i>
                    </div>
                    <div class="btm-det">WSW</div>
                </div>
            </div>
            <div class="weather-det-box">
                <div class="det-box-head">Sunrise & Sunset</div>
                <div class="sunrise">
                    <div class="sun-icn-container">
                        <div class="sun-icn">
                            <i class="fa-solid fa-up-long arrow-icn"></i>
                        </div>
                    </div>
                    <div class="rise-time time"></div>
                </div>
                <div class="sunset">
                    <div class="sun-icn-container">
                        <div class="sun-icn">
                            <i class="fa-solid fa-down-long arrow-icn"></i>
                        </div>
                    </div>
                    <div class="set-time time"></div>
                </div>

            </div>




            <div class="weather-det-box">
                <div class="det-box-head">Humidity</div>
                <div class="det-box-main">
                    <div class="det1 humidity"></div>
                    <div class="det2">%</div>
                </div>
                <div class="det-box-btm">
                    <div class="btm-icn">
                        <i class="fa-brands fa-hotjar hot"></i>
                    </div>
                    <div class="btm-det humidity-status"></div>
                </div>
            </div>
            <div class="weather-det-box">
                <div class="det-box-head">Visibility</div>
                <div class="det-box-main">
                    <div class="det1 visible"></div>
                    <div class="det2">km</div>
                </div>
                <div class="det-box-btm">
                    <div class="btm-icn">
                        <i class="fa-solid fa-arrows-to-eye eye"></i>
                    </div>
                    <div class="btm-det visible-status"></div>
                </div>
            </div>
            <div class="weather-det-box">
                <div class="det-box-head">Air quality</div>
                <div class="det-box-main">
                    <div class="det1 aqi"></div>
                </div>
                <div class="det-box-btm">
                    <div class="btm-icn aqi-icn"></div>
                    <div class="btm-det aqi-det"></div>
                </div>
            </div>



        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
